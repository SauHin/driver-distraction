[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddd"
version = "0.1.0"
description = "Driver distraction detection, COMP6826001 final project."
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
test = ["pytest"]
train = ["torch", "torchvision", "timm"]
app = ["opencv-python"]
report = ["matplotlib"]

[tool.setuptools]
packages = ["ddd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
